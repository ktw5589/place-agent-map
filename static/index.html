<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Place Agent Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <header>
        <p>AI 지도 기반 추천 에이전트</p>
        <h1>공동 맛집 지도</h1>
      </header>

      <form id="place-form" class="box">
        <h2>장소 등록</h2>
        <label>음식점/카페 이름</label>
        <input id="place-name" placeholder="예: 스타벅스 홍대입구점" required />
        <label>내 평점</label>
        <input id="place-rating" type="number" min="0" max="5" step="0.1" value="4.0" required />
        <button type="submit">등록하기</button>
      </form>

      <form id="search-form" class="box">
        <h2>AI 검색</h2>
        <label>원하는 조건</label>
        <input id="search-query" placeholder="예: 조용한 공부를 할 수 있는 카페" required />
        <button id="search-button" type="submit">
          <span class="button-label">AI로 추천받기</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <section class="box">
        <h2>등록된 평점</h2>
        <div id="places-list" class="places-list">아직 등록된 장소가 없습니다.</div>
      </section>

      <section class="box">
        <h2>추천 결과</h2>
        <div id="results" class="results">아직 검색 결과가 없습니다.</div>
      </section>
    </section>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-caption">
        장소 위치는 지도 API 또는 임시 좌표로 표시됩니다. DB에는 지도 자체가 아니라 장소 식별 정보와 사용자 평점만 저장됩니다.
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
